name: Build Native iOS Sender

on:
  workflow_dispatch:
  push:
    paths:
      - "native/ios-garmin-sender/**"
      - "native/garmin-connect-bypass-tweak/**"
      - ".github/workflows/build-native-ios.yml"

jobs:
  package:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl git make perl rsync xz-utils

      - name: Setup Theos
        run: |
          set -euxo pipefail
          git clone --recursive https://github.com/theos/theos "$GITHUB_WORKSPACE/theos"
          echo "THEOS=$GITHUB_WORKSPACE/theos" >> "$GITHUB_ENV"

          mkdir -p "$GITHUB_WORKSPACE/theos/toolchain" "$GITHUB_WORKSPACE/theos/sdks"

          curl -L --fail \
            https://github.com/kabiroberai/swift-toolchain-linux/releases/download/v2.1.0/swift-5.6.1-ubuntu20.04.tar.xz \
            -o /tmp/theos-linux-toolchain.tar.xz
          tar -xJf /tmp/theos-linux-toolchain.tar.xz -C "$GITHUB_WORKSPACE/theos/toolchain"

          curl -L --fail \
            https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS10.3.sdk.tar.xz \
            -o /tmp/iPhoneOS10.3.sdk.tar.xz
          tar -xJf /tmp/iPhoneOS10.3.sdk.tar.xz -C "$GITHUB_WORKSPACE/theos/sdks"

      - name: Show Theos SDKs
        run: find "$THEOS/sdks" -maxdepth 1 -type d -name "iPhoneOS*.sdk" -print

      - name: Build package
        working-directory: native/ios-garmin-sender
        run: make clean package FINALPACKAGE=1 STRIP=0 messages=yes

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: GarminNativeSender-deb
          path: native/ios-garmin-sender/packages/*.deb
          if-no-files-found: error

      - name: Build Garmin Connect bypass tweak
        working-directory: native/garmin-connect-bypass-tweak
        run: make clean package FINALPACKAGE=1 STRIP=0 messages=yes

      - name: Upload bypass tweak Debian package
        uses: actions/upload-artifact@v4
        with:
          name: GarminConnectBypass-deb
          path: native/garmin-connect-bypass-tweak/packages/*.deb
          if-no-files-found: error
