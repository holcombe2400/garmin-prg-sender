name: Build Native iOS Sender

on:
  workflow_dispatch:
  push:
    paths:
      - "native/ios-garmin-sender/**"
      - ".github/workflows/build-native-ios.yml"

jobs:
  package:
    runs-on: macos-13

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: beerpiss/theos-action@v1
        with:
          cache: true
          theos-sdks: https://github.com/theos/sdks

      - name: Show Theos SDKs
        run: find "$THEOS/sdks" -maxdepth 1 -type d -name "iPhoneOS*.sdk" -print

      - name: Build package
        working-directory: native/ios-garmin-sender
        run: make clean package FINALPACKAGE=1 STRIP=0 messages=yes

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: GarminNativeSender-deb
          path: native/ios-garmin-sender/packages/*.deb
          if-no-files-found: error
